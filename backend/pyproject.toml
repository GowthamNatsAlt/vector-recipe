[project]
name = "mini-search-engine-backend"
version = "0.1.0"
description = "FastAPI backend for Vector-based recipe search"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "pandas>=3.0.2",
    "nltk>=3.8.1",
    "scikit-learn>=1.3.0",
    "python-multipart>=0.0.6",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"